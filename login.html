<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | Dalili</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    font-family:Cairo,sans-serif;
    background:#f5f7fb;
}

.login-box{
    width:380px;
    max-width:90%;
    background:white;
    margin:80px auto;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

.login-box button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.login-box button:hover{
    background:#1d4ed8;
}

.login-box p{
    text-align:center;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="login-box">

<h1>تسجيل الدخول</h1>

<input type="email" placeholder="البريد الإلكتروني">

<input type="password" placeholder="كلمة المرور">

<button 
id="loginBtn">
دخول
</button>
<p>
ليس لديك حساب؟
<a href="register.html">إنشاء حساب</a>
</p>
</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
