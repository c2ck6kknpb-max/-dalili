<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | Dalili</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
margin:0;
font-family:Cairo,sans-serif;
background:#f5f7fb;
}

.register-box{
width:420px;
max-width:90%;
background:#fff;
margin:60px auto;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

p{
text-align:center;
margin-top:20px;
}

a{
color:#2563eb;
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>
<div class="register-box">

<h1>إنشاء حساب</h1>

<input id="name" type="text" placeholder="الاسم الكامل">

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور">

<button id="registerBtn">إنشاء حساب</button>

<p>
لديك حساب بالفعل؟
<a href="login.html">تسجيل الدخول</a>
</p>

</div>
<script type="module" src="js/register.js"></script></body>
</html>
