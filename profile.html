<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي | Dalili</title>

<style>
body{
    margin:0;
    font-family:Cairo,Arial;
    background:#f5f7fb;
}

.profile-box{
    width:400px;
    max-width:90%;
    background:white;
    margin:70px auto;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px #0002;
    text-align:center;
}

h1{
    color:#2563eb;
}

.info{
    background:#f1f5f9;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    background:#ef4444;
    color:white;
    border:0;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#dc2626;
}
</style>

</head>

<body>

<div class="profile-box">

<h1>حسابي</h1>

<div class="info">
الاسم:
<br>
<span id="name">...</span>
</div>

<div class="info">
البريد:
<br>
<span id="email">...</span>
</div>

<button id="logout">تسجيل الخروج</button>

</div>


<script type="module" src="js/profile.js"></script>

</body>
</html>
