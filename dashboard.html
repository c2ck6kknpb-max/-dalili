<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | Dalili</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    font-family:Cairo,sans-serif;
    background:#f5f7fb;
    margin:0;
}

.container{
    max-width:800px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

input,select,textarea{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>

<body>

<div class="container">

<h1>إضافة نشاط جديد</h1>

<input id="name" type="text" placeholder="اسم النشاط">

<select id="category">
<option>مطعم</option>
<option>مستشفى</option>
<option>صيدلية</option>
<option>ورشة</option>
<option>متجر</option>
</select>

<input id="city" type="text" placeholder="المدينة">

<input id="phone" type="text" placeholder="رقم الهاتف">

<input id="image" type="text" placeholder="رابط الصورة">

<textarea id="description" placeholder="وصف النشاط"></textarea>

<button onclick="addBusiness()">
إضافة النشاط
</button>

</div>

<script>
function addBusiness(){

alert("في المرحلة الحالية النموذج جاهز فقط.");

}
</script>

</body>
</html>
