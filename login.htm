<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | Dalili</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.login-box{
width:400px;
max-width:90%;
background:white;
margin:70px auto;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px #0002;
}

h1{
text-align:center;
color:#2563eb;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

p{
text-align:center;
}

a{
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>


<div class="login-box">

<h1>Dalili</h1>

<h2>تسجيل الدخول</h2>


<input id="email" type="email" placeholder="البريد الإلكتروني">


<input id="password" type="password" placeholder="كلمة المرور">


<button id="loginBtn">
دخول
</button>


<p>
ليس لديك حساب؟
<a href="register.html">
إنشاء حساب
</a>
</p>


</div>


<script type="module" src="js/login.js"></script>


</body>
</html>
